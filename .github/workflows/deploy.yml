
name: Publicar site na InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Publicar na InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.vscode/**
